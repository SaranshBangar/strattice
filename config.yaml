# All tunables live here. Secrets do NOT — those come from .env only.
#
# ============================ v3: THE DAILY PIVOT ============================
# Rebuilt from a full backtest study on real data (research/FINDINGS.md):
#   * ~2.8y of real CoinDCX daily candles for all 7 INR pairs (the actual venue)
#   * 3y of 1h + 13mo of 15m for the USDT twins (Binance archive) as deep history
#   * every candidate replayed through bot/backtest.py with full India friction
#     (0.2% fee + 18% GST per side, 1% TDS per sell, 5bps slippage)
# Result: EVERY intraday configuration lost money after friction. The 15m lineup
# paid 87-125% of starting capital in fees/TDS on the deep windows. Daily
# trend-following was profitable on nearly every market, robust across the whole
# parameter plateau, and positive in 17/21 (tsmom), 16/21 (breakout) rolling
# out-of-sample folds. So the bot now trades DAILY bars: few, big, slow trades —
# the only altitude where a ~1.5-1.7% round trip is a toll, not a treadmill.
# =============================================================================

engine:
  poll_seconds:
    300 # re-check every 5 min so the engine acts within minutes of each
    #   daily bar CLOSE. Entries AND protective exits key off closed
    #   bars only (no repainting) — exact backtest parity
  candle_interval:
    "1d" # DAILY bars (was 15m). CoinDCX supports [1m,15m,1h,1d]; 1d is the
    #   only altitude that survived the friction study (see header)
  candle_limit:
    400 # > regime_period(100) + slow MA(25) + ATR warmup, with margin.
    #   400 daily bars = ~13 months of history

# --- wallet sizing (constraint B/D) ---
starting_equity: 1000.0 # DRY_RUN simulated wallet. Live ignores this, reads exchange.
allocation_frac: 0.97 # TOTAL fraction of equity deployable across ALL sleeves (the cap).
quote_currency: "INR" # wallet currency the bot sizes/trades in; must match every market's quote side

# --- friction: single source of truth (bot/costs.py) ---
costs:
  fee_rate: 0.002 # 0.2% per side (CoinDCX maker == taker)
  gst_on_fee: 0.18 # 18% GST on the fee
  tds_rate: 0.01 # 1% TDS on SELL consideration (India VDA)
  slippage_bps: 5.0 # adverse market-order slippage, BACKTEST + DRY_RUN fills (5 bps = 0.05%)
  max_fill_notional: 0.0 # DRY_RUN partial-fill liquidity cap per order; 0 = unlimited (full fill)
  edge_margin_pct: 0.002 # extra move a signal must clear beyond round-trip fee+gst

# Hard risk ceilings — FRACTIONS of live equity, computed at check-time (constraint C).
risk:
  max_position_frac:
    1.0 # max single-trade notional as a fraction of equity.
    #   Sleeves (~0.32 each) are tighter, so this is a backstop.
  max_total_capital_at_risk_frac:
    1.0 # max summed open exposure as a fraction of equity.
    #   Sleeves sum to allocation_frac(0.97) < 1.0, so no breach.
  daily_loss_frac:
    0.5 # RUNAWAY-BUG circuit breaker (NOT a market-risk cap):
    #   halt the day if realized loss > 50% of start-of-day equity
  max_trades_per_day:
    6 # churn ceiling on NEW ENTRIES only (position-closing sells —
    #   stops/chandeliers — are never blocked by this cap; see
    #   bot/risk.py). Daily strategies average ~7 trades per YEAR
    #   each; 6/day is pure runaway protection, not a target
  kill_switch_file: "KILL" # presence of this file => cancel open orders + halt
  # Drawdown auto-derisk + circuit breaker (constraint D). Unlike daily_loss_frac
  # (a runaway-BUG breaker), this IS an opt-in MARKET-risk cap measured against an
  # all-time equity high-water-mark that survives restarts. OFF by default so the
  # engine's stance is unchanged ("user accepts full market loss") until you choose
  # to bound it. To enable, set drawdown_derisk_frac > 0. Realized-basis, same as
  # daily_loss (open positions marked at cost; an unrealized loss counts only once
  # closed). Protective exits (stops/chandeliers/take-profit) are NEVER blocked.
  drawdown_derisk_frac: 0.0 # peak-to-trough DD at which NEW entries size down. e.g. 0.08 = 8%
  drawdown_derisk_mult: 0.5 # size multiplier while in the derisk band (0.5 = half size)
  drawdown_kill_frac: 0.0 # DD at which NEW entries are blocked entirely. e.g. 0.15 = 15%

# Each strategy: its own market + params + position tracking + capital sleeve `weight`.
# `weight` is RELATIVE (default 1.0 => equal split). sleeve_frac = allocation_frac*weight/sum(weights).
# Exits are config-driven protective layers (strategies are entry-only):
#   stop_loss_pct / take_profit_pct / max_hold_bars (time-stop) / chandelier_k (ATR trailing).
# regime_period gates every long entry to an uptrend (price above its N-bar SMA, shared).
#
# THE LINEUP (all 1d bars). Six diversified trend engines, one per market, so all six can
# hold concurrently (no-dup-asset rule). Markets were assigned where each strategy was profitable
# on BOTH the INR pair AND its USDT twin (venue robustness, not pair lottery — see FINDINGS).
# Take-profits are OFF everywhere: the fat right tail of trend winners is the whole edge; the
# chandelier (peak - 3.5*ATR14) does the exiting. The 7% hard stop is the disaster brake — note
# it is evaluated on DAILY CLOSES (matching the backtest): a violent single-day move can close
# beyond the line, and the backtested max-drawdowns below already include those events.
# Backtest (₹1000/sleeve, 2023-09 .. 2026-07, net of ALL friction):
#   tsmom @ ETH  +207.6% (PF 2.58, 7 trades)   | USDT twin  +18.3%
#   breakout @ BTC +108.7% (PF 2.75, 8 trades) | USDT twin   +9.2%
#   ma_cross @ XRP +187.7% (PF 2.25, 6 trades) | USDT twin +109.8%
#   volexp @ BNB +143.6% (PF 2.75, 6 trades)   | USDT twin +171.9%
#   squeeze @ DOGE +138.9% (PF 2.85, 9 trades) | USDT twin  +36.5%  (v4, July 2026)
#   accel @ ADA  +60.1% (PF 1.33, 10 trades)   | USDT twin   +1.7%  (v5, July 2026)
# NOTE on accel @ ADA (v5): promoted as the 6th sleeve for SIGNAL-FAMILY diversification, not
# because it is the top scorer on ADA. In an on-ADA bake-off ma_cross (+99.5%/twin +23.3%, WF
# 3/4) and tsmom (+80.4%/twin +50.4%) score higher — but both would CLONE an engine already in
# the lineup (ma_cross@XRP, tsmom@ETH). Acceleration is the strongest NON-duplicate signal family
# for ADA. Caveat: its rolling 200-bar OOS is only 1/4 folds (full-history + plateau are strong;
# see FINDINGS v5). Adding a 6th sleeve dilutes each sleeve from ~0.194 to ~0.162 of equity.
strategies:
  - name: "tsmom_eth" # time-series momentum: buy strength near its highs
    module: "tsmom"
    enabled: true
    weight: 1.0
    market: "I-ETH_INR"
    stop_loss_pct: 0.07 # 7% disaster stop (daily bars need room to breathe)
    take_profit_pct: 0.0 # never cap a trend winner
    chandelier_k: 3.5 # exit at peak - 3.5*ATR (3.5 beat 3.0 across the whole grid)
    atr_period: 14
    max_hold_bars: 0 # no time-stop for trend followers
    params:
      lookback: 30 # 30-day return window (robust across 20/30/40)
      min_return: 0.10 # require +10% over the window (robust across 0.07-0.15)
      near_high_frac: 0.02 # close within 2% of the 30d high — don't buy a fading spike
      regime_period: 50 # 50d SMA uptrend gate
      expected_move_pct: 0.08

  - name: "breakout_btc" # Donchian breakout with volume + volatility confirmation
    module: "momentum"
    enabled: true
    weight: 1.0
    market: "I-BTC_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      lookback: 20 # break of the prior 20-DAY high (classic Donchian 20)
      atr_period: 14
      vol_period: 20
      min_atr_frac: 0.01 # vol floor: ATR >= 1% of price (no breakouts in dead chop)
      vol_mult: 1.0 # last closed day's volume >= its 20d average
      buffer: 0.002 # 0.2% entry buffer over the high
      max_chase: 0.05 # skip if already >5% past the level (daily gaps are bigger)
      regime_period: 50
      expected_move_pct: 0.08

  - name: "ma_xrp" # fast/slow daily MA cross with gap + slope confirmation
    module: "ma_crossover"
    enabled: true
    weight: 1.0
    market: "I-XRP_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      fast: 8 # 8/25 daily cross (best of the tested grid, 7/7 pairs positive)
      slow: 25
      atr_period: 14
      k_atr: 0.2 # fast-slow gap >= 0.2*ATR before entry
      confirm_bars: 3 # cross must be within the last 3 days
      regime_period: 100 # 100d SMA regime gate (slower, matches the slower signal)
      expected_move_pct: 0.08

  - name: "volexp_bnb" # ATR-expansion breakout: vol pop + new local-high close
    module: "vol_expansion"
    enabled: true
    weight: 1.0
    market: "I-BNB_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      short_atr: 5 # 5d ATR vs 20d ATR
      long_atr: 20
      expansion_mult: 1.3 # short ATR >= 1.3x long ATR (78/81 combos positive — plateau)
      breakout_lookback: 10 # close must be the 10d high
      regime_period: 50
      expected_move_pct: 0.06

  - name: "squeeze_doge" # TTM squeeze: low-vol coil, then a confirmed Donchian break (v4)
    module: "squeeze_breakout"
    enabled: true
    weight: 1.0
    market: "I-DOGE_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      bb_period: 20
      k_bb: 2.0
      k_kc: 1.5
      atr_period: 14
      lookback: 20 # break of the prior 20-DAY high after a squeeze
      squeeze_lookback: 6
      vol_period: 20
      vol_mult: 1.0
      buffer: 0.002
      max_chase: 0.05
      min_atr_frac: 0.01
      regime_period: 50
      expected_move_pct: 0.08

  - name: "accel_ada" # acceleration momentum: buy an ACCELERATING leg into fresh highs (v5)
    module: "acceleration"
    enabled: true
    weight: 1.0
    market: "I-ADA_INR"
    stop_loss_pct: 0.07 # same trend-engine exits as the other five sleeves
    take_profit_pct: 0.0 # never cap the parabola — the right tail is the edge
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      fast: 10 # recent 10d leg vs the prior 10d leg (validated plateau default, not ADA-fit)
      min_return: 0.08 # recent leg must be >= +8% (real thrust, not drift)
      accel_mult: 1.5 # recent leg >= 1.5x the prior leg (momentum accelerating)
      breakout_lookback: 20 # close must be the 20d high (accelerating INTO strength)
      vol_period: 20
      vol_mult: 1.0 # last closed day's volume >= its 20d average
      regime_period: 50 # 50d SMA uptrend gate
      expected_move_pct: 0.08

  # --- MIGRATION (v2 -> v3): keep the previously-enabled strategies as DISABLED stubs so an
  #     engine that still holds one of their positions keeps managing its EXITS until flat
  #     (bot/engine.py builds disabled-but-open strategies exit-only). While such a position is
  #     open, the no-dup-asset rule correctly holds the new strategy on that market out until
  #     the old position closes. Delete these two blocks once `python -m bot.status` shows flat.
  - name: "ma_btc" # v2 15m trend follower (retired — see study below)
    module: "ma_crossover"
    enabled: false
    weight: 1.0
    market: "I-BTC_INR"
    stop_loss_pct: 0.04
    take_profit_pct: 0.0
    chandelier_k: 3.0
    atr_period: 16
    max_hold_bars: 0
    params:
      fast: 32
      slow: 96
      atr_period: 16
      k_atr: 0.5
      confirm_bars: 4
      regime_period: 192
      expected_move_pct: 0.05

  - name: "rsi_eth" # v2 15m mean reversion (retired — see study below)
    module: "rsi"
    enabled: false
    weight: 1.0
    market: "I-ETH_INR"
    stop_loss_pct: 0.03
    take_profit_pct: 0.03
    chandelier_k: 0.0
    atr_period: 16
    max_hold_bars: 64
    params:
      period: 14
      oversold: 22
      regime_period: 192
      expected_move_pct: 0.05

  # ============================ RETIRED (evidence) ============================
  # The entire intraday lineup was retired by the backtest study — every configuration
  # below LOST money net of friction on deep real-data windows (research/FINDINGS.md):
  #   rsi @15m (median -3.5%), fast_rsi @15m (-28.6%), bb_reversion @15m (-54.2%),
  #   vol_expansion @15m (-41.5%), squeeze_breakout @15m (-21.6%), momentum @15m (-25.8%),
  #   ma_crossover @15m (-4.8%), Connors RSI2 @15m (0 trades — gates never align),
  #   and every 1h/4h re-expression of the same ideas (fees 87-125% of capital at 1h).
  # Mean reversion stays dead even at DAILY altitude (bb_reversion 1d median -1.2%,
  # fast_rsi 1d -6.8%, rsi/Connors 1d ~0 trades): its many small wins are exactly the
  # shape that 1% TDS per sell taxes to death. The trend/breakout modules only work at
  # 1d — the SAME vol_expansion that lost -41.5% at 15m makes +143.6% at 1d on BNB.
  # The modules stay in the registry (the platform references them); do NOT re-enable
  # anything below daily altitude without a NEW backtest that clears the friction.
  #
  # v4 study (July 2026) additions/rejections:
  #   squeeze_breakout 1d @ DOGE PROMOTED off the bench (18/21 walk-forward folds
  #     positive — best of the study; redundancy with the Donchian breakout doesn't
  #     apply on a different asset sleeve).
  #   supertrend 1d VALIDATED (7/7 INR pairs positive, 15/21 folds, plateau across
  #     mult 2.5-3.5 x ATR 7-14) — offered on the platform (default I-BTC_INR); no
  #     bot sleeve because its venue-robust assets are already taken by stronger
  #     engines (BTC breakout +108.7 vs supertrend +94.6, DOGE squeeze +138.9 vs +17.3).
  #   trend_ensemble (multi-lookback Donchian consensus) REJECTED — long-only spot
  #     adaptation fails venue robustness (best variant 4/7 USDT twins positive).
  # ===========================================================================
