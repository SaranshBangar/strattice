# All tunables live here. Secrets do NOT — those come from .env only.
#
# ============================ v3: THE DAILY PIVOT ============================
# Rebuilt from a full backtest study on real data (research/FINDINGS.md):
#   * ~2.8y of real CoinDCX daily candles for all 7 INR pairs (the actual venue)
#   * 3y of 1h + 13mo of 15m for the USDT twins (Binance archive) as deep history
#   * every candidate replayed through bot/backtest.py with full India friction
#     (0.2% fee + 18% GST per side, 1% TDS per sell, 5bps slippage)
# Result: EVERY intraday configuration lost money after friction. The 15m lineup
# paid 87-125% of starting capital in fees/TDS on the deep windows. Daily
# trend-following was profitable on nearly every market, robust across the whole
# parameter plateau, and positive in 17/21 (tsmom), 16/21 (breakout) rolling
# out-of-sample folds. So the bot now trades DAILY bars: few, big, slow trades —
# the only altitude where a ~1.5-1.7% round trip is a toll, not a treadmill.
# =============================================================================

engine:
  poll_seconds:
    300 # re-check every 5 min so the engine acts within minutes of each
    #   daily bar CLOSE. Entries AND protective exits key off closed
    #   bars only (no repainting) — exact backtest parity
  poll_seconds_fast:
    60 # v8 adaptive cadence: for the first fast_poll_window_minutes after each
    #   bar-close boundary — the only stretch where a fresh CLOSED bar can be
    #   waiting — poll at this faster rate, then relax back to poll_seconds.
    #   Signals are unchanged (closed bars only); this only cuts the latency
    #   between a bar closing and the engine acting on it. 0 disables.
  fast_poll_window_minutes:
    30 # how long after the bar-close boundary the fast cadence applies
  feeds: # v8 multi-source data layer (bot/feeds.py). BOTH fail open: a reference
    #   outage can never strangle the bot — the reference only vetoes when it
    #   demonstrably disagrees, and only substitutes when it is the same market.
    binance_fallback:
      true # B-*_USDT markets: substitute Binance public klines for one cycle when
      #   the primary feed is unusable (same asset+quote). INR pairs NEVER
      #   substitute — no alternative INR venue exists.
    crosscheck:
      true # compare each newly closed bar's RETURN against the USDT twin's return
      #   on the same UTC bar (quote-free comparison, so INR levels cancel).
    max_divergence_pct:
      10.0 # veto threshold in percentage points; a closed daily bar whose return
      #   diverges this much from the global reference is a bad print or a book
      #   dislocation — the engine HOLDs that market for the cycle and alerts.
      #   Checked once per closed bar per market (a few requests/day, not per poll).
  candle_interval:
    "1d" # DAILY bars (was 15m). CoinDCX supports [1m,15m,1h,1d]; 1d is the
    #   only altitude that survived the friction study (see header)
  candle_limit:
    400 # > regime_period(100) + slow MA(25) + ATR warmup, with margin.
    #   400 daily bars = ~13 months of history
  crash_brake:
    false # ALSO check each sleeve's hard stop against the in-progress bar between
    #   daily closes (protective exits are otherwise close-based). OFF because the
    #   v7 portfolio study measured it at -107pts net and +5pts max-DD over the
    #   full window (intraday lows whipsaw positions that recover by the close),
    #   and it deliberately diverges from the close-based backtest. Turn on only
    #   if you want a bounded worst intraday excursion and accept that cost.

# Portfolio-level overlays (v7, research/portfolio_study.py + FINDINGS v7).
portfolio:
  btc_regime_filter: # PROMOTED default-ON: block NEW entries while BTC < its 100d SMA.
    #   Crypto sleeves are one beta bucket (mean pairwise daily-return corr 0.58);
    #   when the bucket's anchor is below its regime line, fresh longs underperform.
    #   Evidence (7-sleeve joint replay, both venues, walk-forward):
    #     INR:  net +239.7% vs +216.7% base | maxDD 22.2 vs 22.5 | PF 4.57 vs 3.50
    #           WF worst fold -1.7% vs -6.2%, compounded +234% vs +213%
    #     USDT: net +102.9% vs  +89.8% base | maxDD 29.4 vs 34.0 | PF 2.54 vs 2.13
    #           WF worst fold -11.8% vs -17.8%
    #   Exits are NEVER touched; if the BTC feed is unusable the filter fails OPEN
    #   (entries proceed unscaled) so a feed outage can't strangle the bot.
    enabled: true
    market: "I-BTC_INR"
    period: 100 # the tested line is the 100d SMA — not "any long MA" (FINDINGS v6/v7)
    entry_mult: 0.0 # 0.0 = block new entries below the line; 0.5 = half-size them
    #   (0.5 also beats baseline on both venues, but 0.0 dominated)

# --- wallet sizing (constraint B/D) ---
starting_equity: 1000.0 # DRY_RUN simulated wallet. Live ignores this, reads exchange.
allocation_frac: 0.97 # TOTAL fraction of equity deployable across ALL sleeves (the cap).
quote_currency: "INR" # wallet currency the bot sizes/trades in; must match every market's quote side

# --- friction: single source of truth (bot/costs.py) ---
costs:
  fee_rate: 0.002 # 0.2% per side (CoinDCX maker == taker)
  gst_on_fee: 0.18 # 18% GST on the fee
  tds_rate: 0.01 # 1% TDS on SELL consideration (India VDA)
  slippage_bps: 5.0 # adverse market-order slippage, BACKTEST + DRY_RUN fills (5 bps = 0.05%)
  max_fill_notional: 0.0 # DRY_RUN partial-fill liquidity cap per order; 0 = unlimited (full fill)
  edge_margin_pct: 0.002 # extra move a signal must clear beyond round-trip fee+gst

# Hard risk ceilings — FRACTIONS of live equity, computed at check-time (constraint C).
risk:
  max_position_frac:
    1.0 # max single-trade notional as a fraction of equity.
    #   Sleeves (~0.32 each) are tighter, so this is a backstop.
  max_total_capital_at_risk_frac:
    1.0 # max summed open exposure as a fraction of equity.
    #   Sleeves sum to allocation_frac(0.97) < 1.0, so no breach.
  daily_loss_frac:
    0.5 # RUNAWAY-BUG circuit breaker (NOT a market-risk cap):
    #   halt the day if realized loss > 50% of start-of-day equity
  max_trades_per_day:
    6 # churn ceiling on NEW ENTRIES only (position-closing sells —
    #   stops/chandeliers — are never blocked by this cap; see
    #   bot/risk.py). Daily strategies average ~7 trades per YEAR
    #   each; 6/day is pure runaway protection, not a target
  kill_switch_file: "KILL" # presence of this file => cancel open orders + halt
  # Drawdown auto-derisk + circuit breaker (constraint D). Unlike daily_loss_frac
  # (a runaway-BUG breaker), this IS an opt-in MARKET-risk cap measured against an
  # all-time equity high-water-mark that survives restarts. OFF by default so the
  # engine's stance is unchanged ("user accepts full market loss") until you choose
  # to bound it. To enable, set drawdown_derisk_frac > 0. Realized-basis, same as
  # daily_loss (open positions marked at cost; an unrealized loss counts only once
  # closed). Protective exits (stops/chandeliers/take-profit) are NEVER blocked.
  drawdown_derisk_frac: 0.0 # peak-to-trough DD at which NEW entries size down. e.g. 0.08 = 8%
  drawdown_derisk_mult: 0.5 # size multiplier while in the derisk band (0.5 = half size)
  drawdown_kill_frac: 0.0 # DD at which NEW entries are blocked entirely. e.g. 0.15 = 15%
  # --- v7 additions (all OFF by default; evidence in research/FINDINGS.md v7) ---
  max_new_entries_per_day:
    0 # cap on NEW entries (buys) per UTC day, 0 = off. Staggers correlated same-day
    #   deployments; deferred sleeves re-signal on later bars while their condition
    #   holds. Study: cap=1 keeps net within 2pts of baseline with a slightly better
    #   worst walk-forward fold (-4.9% vs -6.2%). Off because the edge is marginal.
  max_consecutive_losses_halt:
    0 # halt NEW entries after N consecutive losing round trips (0 = off). This is a
    #   "something is broken" TRIPWIRE needing manual review, NOT a performance
    #   feature: the study shows N=3 can deadlock the portfolio (no entries -> no win
    #   -> never resets; +46% vs +217% baseline). Protective exits always pass.
  sleeve_drawdown_derisk_frac:
    0.0 # per-SLEEVE realized-P&L drawdown (as a fraction of that sleeve's notional) at
    #   which THAT sleeve's new entries scale down (0 = off). Complements the global
    #   drawdown ladder above, which only sees whole-account drawdown.
  sleeve_drawdown_derisk_mult: 0.5 # size multiplier for a derisked sleeve
  # Correlation-bucket exposure caps (off unless BOTH maps are set). All 7 lineup
  # assets are effectively ONE crypto-beta bucket: mean pairwise daily-return
  # correlation 0.58 (range 0.39 XRP/BNB .. 0.71 ETH/BTC) over 2023-09..2026-07.
  # Example — cap total crypto exposure at 80% of equity:
  #   asset_buckets: { BTC: crypto, ETH: crypto, XRP: crypto, BNB: crypto,
  #                    DOGE: crypto, ADA: crypto, SOL: crypto }
  #   exposure_caps: { crypto: 0.8 }

# Each strategy: its own market + params + position tracking + capital sleeve `weight`.
# `weight` is RELATIVE (default 1.0 => equal split). sleeve_frac = allocation_frac*weight/sum(weights).
# Exits are config-driven protective layers (strategies are entry-only):
#   stop_loss_pct / take_profit_pct / max_hold_bars (time-stop) / chandelier_k (ATR trailing).
# regime_period gates every long entry to an uptrend (price above its N-bar SMA, shared).
#
# OPTIONAL per-sleeve keys (v7, all default off; evidence in FINDINGS v7):
#   reentry_cooldown_bars: N   no fresh BUY for N bars after a stop-out (study: neutral
#                              at daily cadence — harmless hygiene knob)
#   entry_slippage_cap_pct: F  skip an entry if the live price already ran >F above the
#                              signal close (live-only guard; backtest-neutral by
#                              construction — a skipped entry re-signals while valid).
#                              Suggested 0.03 if used.
#   vol_target_ann: F          scale entries by target/realized when 20d realized ann.
#                              vol exceeds F (study: 0.40 cuts maxDD 22.5->19.0 and
#                              fees 24.7->17.2 for ~50pts net — a risk dial, not free)
#   exit_ladder_frac: F        regime engines only (chandelier_k 0): sell F of the
#                              position at a exit_ladder_k*ATR trail, ride the rest to
#                              the engine's own exit (study: maxDD -2.1pts INR /
#                              -1.2pts USDT, net neutral) — fires once per position
#   exit_ladder_k: 3.5         ATR multiple for that ladder trail
#
# WEIGHT PRESETS (v7 joint replay; equal weights stay the DEFAULT because preset tilts
# are fitted on the same history they're scored on — treat these as options, not truth):
#   balanced (default): all 1.0                 -> +216.7% | maxDD 22.5% | WF 3/4, worst -6.2%
#   conservative: tsmom_eth 1.2, breakout_btc 1.2, turtle55_xrp 0.8, macd_bnb 1.4,
#                 regime_doge 0.8, ichimoku_ada 0.8, macd_sol 0.8
#                                               -> +229.9% | maxDD 22.8% | WF 3/4, worst -4.1%
#   aggressive:   tsmom_eth 1.2, breakout_btc 0.6, turtle55_xrp 1.4, macd_bnb 1.4,
#                 regime_doge 1.2, ichimoku_ada 0.6, macd_sol 0.6
#                                               -> +269.5% | maxDD 23.5% | WF 3/4, worst -2.4%
#
# THE LINEUP (v6, all 1d bars). Seven engines, one per market — all seven INR pairs held —
# so all can hold concurrently (no-dup-asset rule). Markets were assigned where each strategy
# was profitable on BOTH the INR pair AND its USDT twin (venue robustness, not pair lottery —
# see FINDINGS v6), with the incumbents defending their asset in a same-protocol bake-off.
# Take-profits are OFF everywhere: the fat right tail of trend winners is the whole edge.
# Exits per family: burst-entry engines (tsmom/breakouts/macd) trail a chandelier
# (peak - 3.5*ATR14) + 7% hard stop; regime-holding engines (trend_regime/ichimoku) exit on
# their OWN signal (close under the regime line / kijun) + a wider disaster stop, because a
# trail would cut the multi-month holds their edge depends on. Stops are evaluated on DAILY
# CLOSES (matching the backtest): a violent single-day move can close beyond the line, and
# the backtested max-drawdowns already include those events.
# Backtest (₹1000/sleeve, 2023-09 .. 2026-07, net of ALL friction; WF = 200-bar OOS folds):
#   tsmom @ ETH    +207.6% (PF 2.58) | twin  +18.3% | WF 3/4 INR, 3/4 USDT   (v3, kept)
#   breakout @ BTC +108.7% (PF 2.75) | twin   +9.2% | WF 3/4 INR, 3/4 USDT   (v3, kept)
#   turtle55 @ XRP +274.4% (PF 14.4) | twin +101.9% | WF 2/4 INR, 2/4 USDT   (v6, replaces ma_cross)
#   macd @ BNB     +264.9% (PF 6.85) | twin +188.8% | WF 4/4 INR, 4/4 USDT   (v6, replaces volexp)
#   regime @ DOGE  +209.8% (PF 3.76) | twin +167.5% | WF 3/4 INR, 1/4 USDT   (v6, replaces squeeze)
#   ichimoku @ ADA  +83.3% (PF 1.87) | twin  +42.6% | WF 2/4 INR, 1/4 USDT   (v6, replaces accel)
#   macd @ SOL      +47.8% (PF 1.59) | twin  +14.8% | WF 3/4 INR, 3/4 USDT   (v6, new 7th sleeve)
# v6 notes (evidence + caveats in research/FINDINGS.md v6):
#   * macd@BNB posted the best walk-forward record ever recorded in this repo (8/8 folds
#     across both venues, OOS +224%/+129%) and beats the volexp incumbent on every metric.
#   * regime@DOGE dominates squeeze on full history on BOTH venues and its p>=100-day
#     plateau is 6/6 positive on the USDT twin; caveat: only 1/4 USDT folds (OOS still +24.8%).
#   * ichimoku@ADA beats the retired accel sleeve on every metric (accel twin was +1.7%,
#     USDT OOS -10.5%); its own plateau is 6/6 positive on both venues.
#   * turtle55@XRP (Donchian 55, turtle S2) doubles ma_cross's INR net with a better fold
#     record (2/4 vs 1/4); trade count is low — judge it over months.
#   * macd appears twice (BNB + SOL) — SOL was the one asset with NO venue-robust engine in
#     five studies; macd is the first (3/4 + 3/4 folds), so the clone is accepted there.
#   * 7 sleeves dilute each to ~0.139 of equity — keep total capital >= ~₹1000 so every
#     sleeve clears the ₹100 exchange min-notional.
strategies:
  - name: "tsmom_eth" # time-series momentum: buy strength near its highs
    module: "tsmom"
    enabled: true
    weight: 1.0
    market: "I-ETH_INR"
    stop_loss_pct: 0.07 # 7% disaster stop (daily bars need room to breathe)
    take_profit_pct: 0.0 # never cap a trend winner
    chandelier_k: 3.5 # exit at peak - 3.5*ATR (3.5 beat 3.0 across the whole grid)
    atr_period: 14
    max_hold_bars: 0 # no time-stop for trend followers
    params:
      lookback: 30 # 30-day return window (robust across 20/30/40)
      min_return: 0.10 # require +10% over the window (robust across 0.07-0.15)
      near_high_frac: 0.02 # close within 2% of the 30d high — don't buy a fading spike
      regime_period: 50 # 50d SMA uptrend gate
      expected_move_pct: 0.08

  - name: "breakout_btc" # Donchian breakout with volume + volatility confirmation
    module: "momentum"
    enabled: true
    weight: 1.0
    market: "I-BTC_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      lookback: 20 # break of the prior 20-DAY high (classic Donchian 20)
      atr_period: 14
      vol_period: 20
      min_atr_frac: 0.01 # vol floor: ATR >= 1% of price (no breakouts in dead chop)
      vol_mult: 1.0 # last closed day's volume >= its 20d average
      buffer: 0.002 # 0.2% entry buffer over the high
      max_chase: 0.05 # skip if already >5% past the level (daily gaps are bigger)
      regime_period: 50
      expected_move_pct: 0.08

  - name: "turtle55_xrp" # slow Donchian (turtle S2): break of the prior 55-DAY high (v6)
    module: "momentum"
    enabled: true
    weight: 1.0
    market: "I-XRP_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      lookback: 55 # the classic turtle System-2 window; fires ~2/yr, catches only major legs
      atr_period: 14
      vol_period: 20
      min_atr_frac: 0.01
      vol_mult: 1.0
      buffer: 0.002
      max_chase: 0.05
      regime_period: 100 # slower regime gate to match the slower signal
      expected_move_pct: 0.08

  - name: "macd_bnb" # MACD fresh-cross trend continuation (v6): 8/8 WF folds across venues
    module: "macd_trend"
    enabled: true
    weight: 1.0
    market: "I-BNB_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      fast: 12 # classic 12/26/9 — the whole 12-combo plateau is positive on both venues
      slow: 26
      signal: 9
      confirm_bars: 3 # cross must be fresh (within 3 days)
      require_positive: true # MACD line above zero: continuation only, no counter-trend bounces
      regime_period: 50
      expected_move_pct: 0.08

  - name: "regime_doge" # Faber-style 100d trend-regime holder (v6): long above, flat below
    module: "trend_regime"
    enabled: true
    weight: 1.0
    market: "I-DOGE_INR"
    stop_loss_pct: 0.10 # wider disaster stop: this engine holds through daily noise
    take_profit_pct: 0.0
    chandelier_k: 0.0 # NO trail — the strategy's own SELL (close < line - band) is the exit;
    #   a chandelier would cut the multi-month holds the edge depends on
    atr_period: 14
    max_hold_bars: 0
    params:
      period: 100 # 100-day SMA regime line (plateau: every p>=100 combo positive, both venues)
      band: 0.02 # 2% hysteresis each side — chop around the line costs one round trip, not ten
      slope_bars: 5 # the line itself must be rising
      expected_move_pct: 0.10

  - name: "ichimoku_ada" # Ichimoku kumo breakout (v6): cloud break in, kijun break out
    module: "ichimoku"
    enabled: true
    weight: 1.0
    market: "I-ADA_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 0.0 # NO trail — the strategy's own SELL (close < kijun) is the exit
    atr_period: 14
    max_hold_bars: 0
    params:
      tenkan: 9 # standard 9/26/52 (plateau positive on both venues across all tested sets)
      kijun: 26
      senkou_b: 52
      confirm_bars: 3 # only FRESH cloud breaks — no chasing a market long above the cloud
      expected_move_pct: 0.08

  - name: "macd_sol" # MACD continuation on SOL (v6): the first venue-robust engine for SOL
    module: "macd_trend"
    enabled: true
    weight: 1.0
    market: "I-SOL_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      fast: 12
      slow: 26
      signal: 9
      confirm_bars: 3
      require_positive: true
      regime_period: 50
      expected_move_pct: 0.08

  # --- MIGRATION (v5 -> v6): replaced sleeves kept as DISABLED stubs so an engine that
  #     still holds one of their positions keeps managing its EXITS until flat (see the
  #     v2->v3 note below). Delete each block once `python -m bot.status` shows it flat.
  - name: "ma_xrp" # v3-v5 sleeve, replaced by turtle55_xrp (FINDINGS v6 bake-off)
    module: "ma_crossover"
    enabled: false
    weight: 1.0
    market: "I-XRP_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      fast: 8 # 8/25 daily cross (best of the tested grid, 7/7 pairs positive)
      slow: 25
      atr_period: 14
      k_atr: 0.2 # fast-slow gap >= 0.2*ATR before entry
      confirm_bars: 3 # cross must be within the last 3 days
      regime_period: 100 # 100d SMA regime gate (slower, matches the slower signal)
      expected_move_pct: 0.08

  - name: "volexp_bnb" # v3-v5 sleeve, replaced by macd_bnb (FINDINGS v6 bake-off)
    module: "vol_expansion"
    enabled: false
    weight: 1.0
    market: "I-BNB_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      short_atr: 5 # 5d ATR vs 20d ATR
      long_atr: 20
      expansion_mult: 1.3 # short ATR >= 1.3x long ATR (78/81 combos positive — plateau)
      breakout_lookback: 10 # close must be the 10d high
      regime_period: 50
      expected_move_pct: 0.06

  - name: "squeeze_doge" # v4-v5 sleeve, replaced by regime_doge (FINDINGS v6 bake-off)
    module: "squeeze_breakout"
    enabled: false
    weight: 1.0
    market: "I-DOGE_INR"
    stop_loss_pct: 0.07
    take_profit_pct: 0.0
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      bb_period: 20
      k_bb: 2.0
      k_kc: 1.5
      atr_period: 14
      lookback: 20 # break of the prior 20-DAY high after a squeeze
      squeeze_lookback: 6
      vol_period: 20
      vol_mult: 1.0
      buffer: 0.002
      max_chase: 0.05
      min_atr_frac: 0.01
      regime_period: 50
      expected_move_pct: 0.08

  - name: "accel_ada" # v5 sleeve, replaced by ichimoku_ada (accel twin was +1.7%, WF 1/4;
    #   ichimoku beats it on every metric — FINDINGS v6)
    module: "acceleration"
    enabled: false
    weight: 1.0
    market: "I-ADA_INR"
    stop_loss_pct: 0.07 # same trend-engine exits as the other five sleeves
    take_profit_pct: 0.0 # never cap the parabola — the right tail is the edge
    chandelier_k: 3.5
    atr_period: 14
    max_hold_bars: 0
    params:
      fast: 10 # recent 10d leg vs the prior 10d leg (validated plateau default, not ADA-fit)
      min_return: 0.08 # recent leg must be >= +8% (real thrust, not drift)
      accel_mult: 1.5 # recent leg >= 1.5x the prior leg (momentum accelerating)
      breakout_lookback: 20 # close must be the 20d high (accelerating INTO strength)
      vol_period: 20
      vol_mult: 1.0 # last closed day's volume >= its 20d average
      regime_period: 50 # 50d SMA uptrend gate
      expected_move_pct: 0.08

  # --- MIGRATION (v2 -> v3): keep the previously-enabled strategies as DISABLED stubs so an
  #     engine that still holds one of their positions keeps managing its EXITS until flat
  #     (bot/engine.py builds disabled-but-open strategies exit-only). While such a position is
  #     open, the no-dup-asset rule correctly holds the new strategy on that market out until
  #     the old position closes. Delete these two blocks once `python -m bot.status` shows flat.
  - name: "ma_btc" # v2 15m trend follower (retired — see study below)
    module: "ma_crossover"
    enabled: false
    weight: 1.0
    market: "I-BTC_INR"
    stop_loss_pct: 0.04
    take_profit_pct: 0.0
    chandelier_k: 3.0
    atr_period: 16
    max_hold_bars: 0
    params:
      fast: 32
      slow: 96
      atr_period: 16
      k_atr: 0.5
      confirm_bars: 4
      regime_period: 192
      expected_move_pct: 0.05

  - name: "rsi_eth" # v2 15m mean reversion (retired — see study below)
    module: "rsi"
    enabled: false
    weight: 1.0
    market: "I-ETH_INR"
    stop_loss_pct: 0.03
    take_profit_pct: 0.03
    chandelier_k: 0.0
    atr_period: 16
    max_hold_bars: 64
    params:
      period: 14
      oversold: 22
      regime_period: 192
      expected_move_pct: 0.05

  # ============================ RETIRED (evidence) ============================
  # The entire intraday lineup was retired by the backtest study — every configuration
  # below LOST money net of friction on deep real-data windows (research/FINDINGS.md):
