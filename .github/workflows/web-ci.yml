name: web-ci

on:
  pull_request:
    paths:
      - "strattice/web/**"
      - "strattice/worker/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "strattice/web/**"
      - "strattice/worker/**"
      - ".github/workflows/web-ci.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strattice/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strattice/web/package-lock.json

      # check:crypto round-trips through worker/crypto.py; check:entitlements
      # compares lib/entitlements.ts against worker/entitlements.py.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run check:crypto
      - run: npm run check:entitlements
      - run: npm run check:webhook
