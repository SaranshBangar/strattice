# Named Cloudflare tunnel for the bot status server. Install to /etc/cloudflared/config.yml.
# Gives a PERMANENT hostname (unlike `cloudflared tunnel --url`, which is random each run).
# See deploy/TUNNEL.md for the one-time setup that creates the tunnel + credentials file.
tunnel: coindcx
credentials-file: /etc/cloudflared/coindcx.json

ingress:
  # Change to your real subdomain (must be a zone on your Cloudflare account).
  - hostname: bot.example.com
    service: http://127.0.0.1:8787
  # Catch-all: anything else gets a 404 instead of reaching the bot.
  - service: http_status:404
